# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration \
$time
$character
"""

[character]
format = '\$(fg:#88C0D0)'

[cmd_duration]
min_time = 1
format = '[$duration](bold yellow) | '

[directory]
truncate_to_repo = false
truncation_symbol = "…/"
format = '[ $path ]($style)[$read_only]($read_only_style)'

[fill]
symbol = '─'

# git 情報を囲む "(" ")" は custom モジュールをやめた代わりに
# git_branch / git_status の format に直接持たせている。
# git 管理外では両モジュールとも空になるため、括弧だけが残ることはない。
[git_branch]
format = '\([$symbol$branch(:$remote_branch)]($style)'

# ブランチ名とステータスの間の空白は、ステータスが空のとき
# "( main )" にならないよう外側の条件付きグループの中に入れてある。
[git_status]
format = '[( (\[$staged$conflicted$stashed$deleted$renamed$modified$typechanged$untracked\])($ahead_behind))]($style)\)'
untracked = '?${count}'
modified = '*${count}'
deleted = '-${count}'
conflicted = '!${count}'
staged = '[+${count}](green)|'

[time]
disabled = false

[username]
style_user = 'white bold'
style_root = 'black bold'
format = 'user: [$user]($style) '
disabled = false
show_always = true
